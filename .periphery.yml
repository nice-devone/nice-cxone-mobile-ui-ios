report_exclude:
- ../cxone-chat-sdk/**
- ../cxone-guide-utility/**
- Sources/Resources/Generated/*
- Sources/Utilities/Customization/Colors/*
skip_build: true
# Periphery's defaults plus `**/checkouts/**`: CI clones packages with -clonedSourcePackagesDirPath,
# which puts them under <dir>/checkouts/ instead of SourcePackages/checkouts/
index_exclude:
- "**/*?.build/**/*"
- "**/SourcePackages/checkouts/**"
- "**/checkouts/**"
index_store_path: derivedData/Index.noindex/DataStore/
verbose: false
relative_results: true
quiet: true
retain_assign_only_properties: true
retain_unused_protocol_func_params: true
retain_objc_accessible: true
retain_swift_ui_previews: true
retain_public: true